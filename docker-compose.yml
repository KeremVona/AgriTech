services:
  # -------------------------------------------------------------
  # 1. PostgreSQL 16 with PostGIS Spatial Extension
  # -------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agritech_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agritech_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
      - ./docker/postgres/02-make-tables.sql:/docker-entrypoint-initdb.d/02-make-tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agritech_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Eclipse Mosquitto MQTT Broker (IoT Sensor Simulation)
  # -------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: agritech_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"  # MQTT protocol
      - "9001:9001"  # MQTT over WebSockets
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # -------------------------------------------------------------
  # 3. AgriTech ML & Vision Inference Service (TODO-106)
  #
  # Build:  docker compose build ml-service
  # Start:  docker compose up ml-service
  # Logs:   docker compose logs -f ml-service
  # Docs:   http://localhost:8000/docs
  # -------------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: agritech_ml_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ONNX model path inside the container (matches config.py default)
      ONNX_MODEL_PATH: models/agritech_classifier.onnx
      # Set to true for verbose request/startup logging during development
      DEBUG: ${ML_DEBUG:-false}
      # Comma-separated CORS origins (frontend dev server + production URL)
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    volumes:
      # Mount the local models directory so the ONNX artifact can be
      # updated without rebuilding the image (useful during ML-102/103 iterations)
      - ./ml-service/models:/app/models:ro
    healthcheck:
      # Polls /health/ready which reports ONNX model memory residency
      test:
        - "CMD"
        - "python"
        - "-c"
        - >
          import urllib.request, sys;
          r = urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4);
          sys.exit(0 if r.status == 200 else 1)
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Informational ordering: ml-service does not technically depend on postgres
    # but listing it here makes intent clear for future DB logging (Phase 2+)
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # 4. AgriTech Satellite NDVI Timeline Service
  #
  # Build:  docker compose build satellite-service
  # Start:  docker compose up satellite-service
  # Logs:   docker compose logs -f satellite-service
  # Docs:   http://localhost:8100/docs
  # -------------------------------------------------------------
  satellite-service:
    build: ./satellite-service
    container_name: agritech_satellite_service
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    volumes:
      - satellite_cache:/app/cache
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - >
          import urllib.request, sys;
          r = urllib.request.urlopen('http://localhost:8100/health/live', timeout=4);
          sys.exit(0 if r.status == 200 else 1)
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
    name: agritech_postgres_data
  mosquitto_data:
    name: agritech_mosquitto_data
  mosquitto_log:
    name: agritech_mosquitto_log
  satellite_cache:
    name: agritech_satellite_cache
