# ==========================================
# Eclipse Mosquitto 2.0 — AgriTech Platform (BACK-304)
# Authenticated Internal MQTT Broker Configuration
# ==========================================

# Enforce authentication globally across all listeners (MQTT + WebSockets)
per_listener_settings false
allow_anonymous false
password_file /tmp/mosquitto_pwfile
acl_file /tmp/mosquitto_acl.conf

# Standard MQTT TCP listener (accessible internally on agritech_internal network & 127.0.0.1)
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener (authenticated browser/diagnostic observation on 127.0.0.1)
listener 9001 0.0.0.0
protocol websockets

# Persistent sessions & queued QoS 1/2 messages across brief client reconnects
persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 7d
max_queued_messages 1000
max_inflight_messages 40

# Operational safety limits
max_packet_size 65536
max_keepalive 120

# Structured container logging
log_dest stdout
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
