# ==========================================
# Eclipse Mosquitto Topic ACL — Precision AgriTech (BACK-304)
# Standardized Topics:
#   - agri/telemetry/{parcelId}
#   - agri/actuator/{parcelId}/valve
# ==========================================

# ASP.NET Core Backend Service:
# - Persistent wildcard read on all parcel telemetry (agri/telemetry/#)
# - Publishes & observes valve actuation commands (agri/actuator/{parcelId}/valve)
# - Broker liveness probe (agri/health/#)
user agritech_backend
topic read agri/telemetry/#
topic readwrite agri/actuator/+/valve
topic readwrite agri/health/#

# Virtual Soil Sensor Simulator (TODO-305 / TODO-306):
# - Publishes sensor telemetry packets per parcel (agri/telemetry/{parcelId})
# - Subscribes to valve actuation commands for moisture rebound loop
user agritech_simulator
topic write agri/telemetry/+
topic read agri/actuator/+/valve
